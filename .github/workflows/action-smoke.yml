name: Action Smoke

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: action-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Composite action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create fixture images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-assets
          # Redundant coordinate precision and stroke width so the SVG minifier
          # has something to shrink; a trivially-minimal SVG would already be
          # optimal and would make check mode (correctly) pass, breaking the
          # assertion below.
          cat > smoke-assets/optimizable.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">
            <path d="M 10.000000 10.000000 L 190.000000 10.000000 L 190.000000 190.000000 L 10.000000 190.000000 Z" fill="blue" stroke="black" stroke-width="1.0000000"/>
          </svg>
          SVG
          cp smoke-assets/optimizable.svg smoke-assets/dry-run.svg
          cp smoke-assets/optimizable.svg smoke-assets/lossy.svg
          cp smoke-assets/optimizable.svg smoke-assets/write.svg

      - name: Check mode reports optimizable files
        id: check
        continue-on-error: true
        uses: ./
        with:
          paths: smoke-assets/optimizable.svg
          check: "true"

      - name: Assert check mode failed as expected
        if: steps.check.outcome != 'failure'
        shell: bash
        run: |
          echo "::error::check mode should fail when a file can be optimized"
          exit 1

      - name: Dry run leaves files untouched
        uses: ./
        with:
          paths: smoke-assets/dry-run.svg
          dry-run: "true"
          json: "true"

      - name: Normal lossless mode runs
        uses: ./
        with:
          paths: smoke-assets/write.svg

      - name: Explicit lossy mode with threshold runs
        uses: ./
        with:
          paths: smoke-assets/lossy.svg
          lossy: "true"
          min-savings: "10"
          dry-run: "true"

  # What users get: the action and the binary of the released tag, not the
  # wrapper of this branch. Bump the tag after every release.
  released:
    name: Released action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Create a compressible PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-assets
          python3 - <<'PY'
          import struct, zlib

          def chunk(kind, data):
              body = kind + data
              return struct.pack(">I", len(data)) + body + struct.pack(">I", zlib.crc32(body))

          width = height = 64
          rows = b"".join(b"\x00" + bytes([200, 30, 30]) * width for _ in range(height))
          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(rows, 0))
              + chunk(b"IEND", b"")
          )
          open("smoke-assets/released.png", "wb").write(png)
          PY
          wc -c < smoke-assets/released.png > smoke-assets/before.txt

      - name: Optimize with the released action
        uses: newmatik/image-optimizer@v0.2.1
        with:
          paths: smoke-assets/released.png

      - name: Assert the file shrank and is still a PNG
        shell: bash
        run: |
          set -euo pipefail
          before=$(cat smoke-assets/before.txt)
          after=$(wc -c < smoke-assets/released.png)
          echo "released.png: $before -> $after bytes"
          [ "$after" -lt "$before" ]
          [ "$(head -c 8 smoke-assets/released.png | od -An -tx1 | tr -d ' \n')" = "89504e470d0a1a0a" ]

      - name: A second run finds nothing left to do
        uses: newmatik/image-optimizer@v0.2.1
        with:
          paths: smoke-assets/released.png
          check: "true"
