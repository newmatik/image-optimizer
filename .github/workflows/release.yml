name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    # Our own runners only, and only for this repository's tags or a dispatch by a maintainer.
    if: github.repository == 'newmatik/image-optimizer' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.runner == 'windows' && (vars.WINDOWS_RUNNER || 'beast-windows') || matrix.runner == 'macos' && (vars.MACOS_RUNNER || 'macbook') || matrix.runner == 'linux-arm' && vars.LINUX_ARM_RUNNER || (vars.LINUX_RUNNER || 'beast') }}
    strategy:
      fail-fast: false
      matrix:
        # Both macOS targets build on the arm64 Mac runner: x86_64-apple-darwin is
        # cross-compiled and its tests run on arm64 only (no Intel Mac runner).
        # aarch64-unknown-linux-gnu needs an arm64 Linux runner: it is built only when
        # the variable LINUX_ARM_RUNNER names one. Keep EXPECTED_PACKAGES in publish in step.
        include: ${{ fromJSON(vars.LINUX_ARM_RUNNER && '[{"runner":"macos","target":"aarch64-apple-darwin"},{"runner":"macos","target":"x86_64-apple-darwin"},{"runner":"linux","target":"x86_64-unknown-linux-gnu"},{"runner":"linux-arm","target":"aarch64-unknown-linux-gnu"},{"runner":"windows","target":"x86_64-pc-windows-msvc"}]' || '[{"runner":"macos","target":"aarch64-apple-darwin"},{"runner":"macos","target":"x86_64-apple-darwin"},{"runner":"linux","target":"x86_64-unknown-linux-gnu"},{"runner":"windows","target":"x86_64-pc-windows-msvc"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Build from the requested tag (workflow_dispatch can run from any
          # ref), and don't leave the job token in .git/config for cargo build.
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify tag matches crate version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo pkgid -p imageopt | awk -F# '{print $2}')"
          expected="v$version"
          actual="${{ steps.tag.outputs.tag }}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Release tag $actual does not match crate version $version"
            exit 1
          fi

      - name: Install nasm (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Install nasm (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm

      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install nasm -y
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Tests the runner's own architecture (arm64 for both macOS targets).
      - name: Test
        run: cargo test --all-features

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin imageopt

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          name="imageopt-${{ steps.tag.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/imageopt" "dist/$name/"
          cp README.md LICENSE "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "imageopt-${{ steps.tag.outputs.tag }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/imageopt.exe" "dist/$name/"
          Copy-Item README.md,LICENSE "dist/$name/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File "dist/$name.zip.sha256" -Encoding ascii

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: imageopt-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Publish release
    needs: build
    if: github.repository == 'newmatik/image-optimizer' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ vars.LINUX_RUNNER || 'beast' }}
    # The only job that writes: it creates the release and uploads the packages.
    permissions:
      contents: write
    env:
      # One archive and one checksum per build target (see the build matrix).
      EXPECTED_PACKAGES: ${{ vars.LINUX_ARM_RUNNER && '5' || '4' }}
    steps:
      # The job has no checkout and Beast keeps its workspace between jobs: start
      # from an empty dist so only this run's packages are counted and uploaded.
      - name: Remove stale packages
        shell: bash
        run: rm -rf dist

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # A rerun of only this job after the build artifacts expired downloads nothing:
      # fail instead of publishing a release without binaries.
      - name: Check all packages are present
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          archives=$(find dist -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          sums=$(find dist -maxdepth 1 -name '*.sha256' | wc -l)
          if [ "$archives" -ne "$EXPECTED_PACKAGES" ] || [ "$sums" -ne "$EXPECTED_PACKAGES" ]; then
            echo "::error::Expected $EXPECTED_PACKAGES archives and checksums, found $archives and $sums. Re-run all jobs."
            exit 1
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
